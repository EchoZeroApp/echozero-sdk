name: Verify credentials

# Read-only credential check. Publishes NOTHING.
# Run this after adding each registry secret, so a bad or mis-scoped token
# is caught here rather than part-way through the real release sequence.
on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Token is valid and identifies an account
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set - skipping"; exit 0; fi
          echo "authenticated as: $(npm whoami)"
      # NOTE: do not add `npm access list packages @echozero` here. That hits
      # GET /-/org/echozero/package, an ORG endpoint, which 403s unless the
      # token is granted Organizations access. Publishing does not need that
      # permission, so the correct fix is to leave the token org-less and not
      # to run this check. Write scope is only provable at publish time - which
      # is safe, because a failed npm publish is non-destructive and retryable.
      - name: Tarball builds and is publishable
        working-directory: packages/typescript
        run: |
          npm ci
          npm publish --dry-run

  crates:
    runs-on: ubuntu-latest
    steps:
      - name: Token is valid
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set - skipping"; exit 0; fi
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' \
            -H "Authorization: $CARGO_REGISTRY_TOKEN" \
            -A "echozero-ci (support@echozero.app)" \
            https://crates.io/api/v1/me)
          echo "HTTP $code"
          echo "body: $(cat /tmp/me.json)"
          case "$code" in
            200)
              echo "authenticated as: $(python3 -c 'import json;print(json.load(open("/tmp/me.json"))["user"]["login"])')" ;;
            403)
              # A token scoped to publish-new/publish-update cannot read /me.
              # That is the correct, least-privilege shape - so this is a pass.
              # A genuinely invalid token returns 403 with an explicit
              # "authentication failed" style message, which we surface above.
              echo "::notice::/me is not readable by a publish-scoped token. Expected for a correctly scoped token; check the body above if the publish later fails on auth." ;;
            *)
              echo "::error::Unexpected response from crates.io (HTTP $code)"; exit 1 ;;
          esac

  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: OIDC identity can be minted for Trusted Publishing
        uses: actions/github-script@v7
        with:
          script: |
            // Proves this workflow+environment can mint the OIDC token PyPI checks.
            // It does NOT prove the publisher is registered on PyPI's side - that
            // only shows up on the first real publish.
            const t = await core.getIDToken('pypi')
            core.info(t ? 'OIDC token minted OK' : 'no token')
