[package]
name = "echozero"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for EchoZero REST, MCP, webhooks, and signal streams."
license = "MIT"
readme = "README.md"
homepage = "https://docs.echozero.app/guides/sdk"
documentation = "https://docs.rs/echozero"
repository = "https://github.com/EchoZeroApp/echozero-sdk"
keywords = ["echozero", "trading", "webhooks", "hmac", "solana"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["net"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
url = "2"

[features]
default = []
websocket = ["tokio", "tokio-tungstenite"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
